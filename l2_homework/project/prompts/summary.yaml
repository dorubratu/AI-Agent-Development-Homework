name: summary
version: "1.0.0"
description: >
  Prompt de rezumare: produce un răspuns final scurt pentru utilizator, pe baza observațiilor și a întrebării originale.

prompt: |
  Rezumă răspunsul pentru utilizator în maxim {{ max_words }} cuvinte.

  Întrebare:
  {{ question }}

  Date relevante:
  {% for obs in observations %}
  - {{ obs }}
  {% endfor %}

  Ton: {{ tone | default("neutru, profesionist") }}.
  Nu menționa tool-urile folosite — utilizatorul vrea doar răspunsul.
